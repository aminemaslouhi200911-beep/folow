<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحتي الشخصية</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(145deg, #001a40, #0066ff, #00bfff);
}

.card {
  width: 88%;
  max-width: 360px;
  padding: 30px 22px;
  text-align: center;
  border-radius: 28px;
  background: rgba(0, 20, 60, 0.55);
  border: 1px solid rgba(255,255,255,.3);
  box-shadow: 0 15px 45px #00102b80;
}

.profile {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #65d9ff;
  box-shadow: 0 0 22px #00aaff;
}

h2 {
  margin: 18px 0 25px;
  font-size: 27px;
}

.social {
  display: block;
  padding: 15px;
  margin: 13px 0;
  border-radius: 15px;
  color: white;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  background: rgba(255,255,255,.13);
  border: 1px solid #ffffff45;
  transition: .25s;
}

.social:hover {
  background: #168cff;
  transform: scale(1.04);
}

footer {
  margin-top: 22px;
  color: #cceaff;
  font-size: 12px;
}
</style>
</head>

<body>
<div class="card">

  <!-- ضع رابط صورتك هنا -->
  <img class="profile"
       src="amo.png"
       alt="صورتي">

  <!-- ضع اسمك هنا -->
  <h2>amine maslouhi</h2>

  <!-- ضع روابط حساباتك هنا -->
  <a class="social"
     href="https://instagram.com/amine__msl_?mdxt=Y3hka2Y3YzVtcTh3"
     target="_blank">📸 Instagram</a>

  <a class="social"
     href="https://www.facebook.com/share/1K5Mp5dv87/"
     target="_blank">📘 Facebook</a>

  <a class="social"
     href="https://www.tiktok.com/@amine__msl_?_r=1&_t=ZS-9AVDoif4u5E"
     target="_blank">🎵 TikTok</a>

  <footer>Follow me on my account 💙</footer>

</div>
</body>
</html>
